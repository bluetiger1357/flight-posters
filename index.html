
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Posters</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background: #f4f4f4;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    figure {
      margin: 0;
    }
    figcaption {
      padding: 0.5rem 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Flight Posters</h1>
  <div class="gallery">
    
    <figure>
      <img src="./posters/TWA_Starliner.jpg"
           alt="TWA Starliner">
      <figcaption>TWA Starliner</figcaption>
    </figure>
    
  </div>
</body>
</html>
